<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HASTA LA VISTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&family=Saira+Stencil+One&display=swap">
<style>
  :root{
    --ink:#f2e8cd; --dim:#a1977c; --gold:#e5bd6b; --warn:#ee9f5f; --bad:#d85f46; --ok:#95b56b;
    --olive1:#3c432c; --olive2:#232819; --edge:#5d6740; --bg:#05060a;
    /* Oswald — узкий гротеск с полной кириллицей, держит трафаретный характер.
       IBM Plex Sans — самая читаемая кириллица для реплик.
       IBM Plex Mono — цифры и шкалы, моноширинные и не прыгают. */
    --stencil:'Oswald','Impact','Franklin Gothic Heavy','Arial Narrow',sans-serif;
    --ui:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --text:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    /* Saira Stencil One — трафарет по армейскому ящику, есть вьетнамская диакритика */
    --mil:'Saira Stencil One','Stardos Stencil','Oswald','Arial Narrow',sans-serif;
    --sh:0 1px 0 #000, 0 2px 6px #000c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--ui);overflow:hidden;touch-action:manipulation}
  #stage{position:relative;margin:0 auto}
  canvas{display:block;width:100%;height:100%}
  .layer{position:absolute;inset:0;pointer-events:none}

  #ticker{position:absolute;left:0;right:0;top:0;height:1.6em;overflow:hidden;display:none;
    background:linear-gradient(180deg,#05060ae0,#05060a00)}
  #ticker span{position:absolute;white-space:nowrap;font-size:.72em;line-height:2.2em;
    color:#d4bd88;letter-spacing:.12em;text-shadow:var(--sh)}
  .hrow{display:flex;gap:1.1em;align-items:baseline;justify-content:center;margin-bottom:.3em}
  .hrow .km{font-size:1.15em;color:var(--gold);letter-spacing:.09em;text-shadow:var(--sh)}
  .hrow .clock{font-size:.68em;color:var(--dim);letter-spacing:.14em}
  .hrow .left{font-size:.76em;color:#cbd6a2;letter-spacing:.12em}
  .hrow .left.hot{color:var(--bad)}

  #wlabel{position:absolute;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:linear-gradient(180deg,#4a4226,#241f10);border:1px solid var(--gold);border-radius:5px;
    padding:.22em .6em;font-size:.82em;letter-spacing:.1em;color:#ffeab6;box-shadow:0 3px 10px #000b;
    text-shadow:var(--sh)}
  #wlabel b{color:var(--gold);font-weight:400}
  #carlabel{position:absolute;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:linear-gradient(180deg,#26402f,#101c14);border:1px solid #6fae86;border-radius:5px;
    padding:.22em .6em;font-family:var(--text);font-size:.82em;letter-spacing:.02em;color:#ddf7e5;
    box-shadow:0 3px 10px #000b;text-shadow:var(--sh)}
  #carlabel b{color:#8fd6a6;font-weight:400}

  #hud{position:absolute;left:50%;transform:translateX(-50%);top:2em;max-width:calc(100% - 1.2em);
    background:linear-gradient(180deg,#2c3220f5,#12150cfa);
    border:1px solid var(--edge);border-radius:12px;
    box-shadow:inset 0 1px 0 #ffffff18, inset 0 0 22px #000b, 0 3px 0 #0009;
    padding:.35em .8em .4em}
  .gauges{display:flex;flex-wrap:wrap;gap:.2em 1.15em;justify-content:center}
  .g{display:flex;align-items:center;gap:.4em;font-size:.6em;letter-spacing:.1em;color:var(--dim)}
  .g .lb{min-width:4.8em;flex:none}
  .g .seg{display:flex;gap:2px;flex:none;margin:0 .15em}
  .g .seg i{width:.36em;height:.6em;background:#00000099;border-radius:1px;box-shadow:inset 0 0 0 1px #ffffff12}
  .g .seg i.on{background:#c3b184}
  .g.warn .seg i.on{background:var(--warn)}
  .g.bad  .seg i.on{background:var(--bad)}
  .g.good .seg i.on{background:var(--ok)}
  .g .vl{min-width:3.2em;color:var(--ink);text-align:right;font-weight:500;letter-spacing:.06em}
  #stuff{font-size:.62em;color:var(--dim);letter-spacing:.22em;text-align:center;margin-top:.45em;
    padding-top:.35em;border-top:1px solid #ffffff12}

  #sms{position:absolute;right:.7em;top:8.4em;width:13em;display:flex;flex-direction:column;gap:.45em}
  .sm{border-left:2px solid var(--gold);padding:.12em 0 .12em .5em;font-size:.74em;line-height:1.45;
    text-shadow:var(--sh);opacity:0;transform:translateY(-5px);transition:opacity .4s,transform .4s}
  .sm.on{opacity:1;transform:none}
  .sm u{display:block;color:var(--gold);text-decoration:none;letter-spacing:.14em;font-size:.85em}

  #panel,#dlg{position:absolute;left:1em;right:1em;bottom:3.4em;pointer-events:auto;display:none;
    background:linear-gradient(180deg,#312816f8,#120d06fc);
    border:2px solid #7d6740;border-radius:7px;
    box-shadow:inset 0 0 0 3px #120d06, inset 0 0 0 4px #574526,
               inset 0 0 30px #000b, 0 6px 18px #000c;
    padding:.8em 1em .85em;max-height:54%;overflow:auto;scrollbar-width:thin;
    scrollbar-color:#6b5836 #1a130a}

  .who .tip{float:right;font-style:normal;color:#7c7358;letter-spacing:.1em;font-size:.85em;
    text-transform:none}
  .who{color:var(--gold);letter-spacing:.26em;font-size:.8em;margin-bottom:.5em;
    border-bottom:1px solid #4a3c22;padding-bottom:.35em;text-shadow:var(--sh)}
  .say{line-height:1.55;color:#fff6e0;font-size:1.08em;text-shadow:var(--sh);
    font-family:var(--text);font-weight:400}
  .opts{margin-top:.55em;display:flex;flex-direction:column;gap:.14em}
  .opt{background:#ffffff08;border:1px solid #ffffff10;border-radius:5px;
    color:#f0e2b8;font-family:var(--text);font-size:.98em;text-align:left;
    padding:.3em .5em;cursor:pointer;display:flex;gap:.65em;align-items:baseline;text-shadow:var(--sh)}
  .opt:hover,.opt:focus{color:#fff;background:#e5bd6b26;border-color:#e5bd6b66;outline:none}
  .opt em{font-style:normal;color:#0f0c06;background:var(--gold);border-radius:3px;
    min-width:1.4em;text-align:center;font-size:.8em;padding:.05em .25em;font-family:var(--ui);
    font-weight:500;flex:none}
  .opt.lock{color:#807a68;background:#ffffff04;border-color:#ffffff0a;cursor:not-allowed}
  .opt.lock em{background:#4e4a3d;color:#171510}
  .opt.lock:hover{background:#ffffff04;border-color:#ffffff0a;color:#807a68}
  .opt .why{display:block;margin-top:.15em;font-size:.76em;font-style:italic;
    color:#6e6857;letter-spacing:.02em}
  .opt.rage{color:#f08064}
  .opt.rage em{background:#c0503c;color:#fff}
  .opt.rage:hover{background:#c0503c2e;border-color:#c0503c88;color:#ffb49f}

  #keys{position:absolute;left:0;right:0;bottom:.7em;display:flex;flex-wrap:wrap;
    justify-content:center;gap:.35em 1.1em;font-family:var(--text);font-size:.72em;
    color:#d8cfb4;letter-spacing:.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #keys span{display:flex;align-items:center;gap:.32em}
  #keys kbd{font-family:var(--ui);background:#141810cc;border:1px solid #6d7a4a;border-radius:4px;
    padding:.06em .4em;color:#ffeeba;font-size:.92em;
    box-shadow:0 1px 0 #0009, inset 0 1px 0 #ffffff10}
  #tip{position:absolute;left:0;right:0;bottom:4.5em;text-align:center;
    font-family:var(--text);font-size:.86em;color:#ffd88f;letter-spacing:.02em;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 18px rgba(255,190,110,.25)}
  #tip.urgent{color:#ff9a72;font-weight:600;font-size:.95em;
    text-shadow:0 1px 3px #000, 0 0 20px rgba(255,120,70,.45);animation:pulse .7s infinite alternate}
  @keyframes pulse{from{opacity:.65}to{opacity:1}}
  #hint{position:absolute;left:0;right:0;bottom:3.1em;text-align:center;
    font-family:var(--text);font-weight:500;font-size:.88em;
    color:#fbf1d8;letter-spacing:.04em;
    text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 16px rgba(235,205,140,.22)}
  #toast{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:1.05em;color:var(--gold);
    letter-spacing:.16em;opacity:0;transition:opacity .35s;text-shadow:var(--sh)}

  #dice{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#05070cdb;pointer-events:auto}
  #dice .box{background:linear-gradient(180deg,#312816,#120d06);border:2px solid #7d6740;border-radius:7px;
    box-shadow:inset 0 0 0 1px #0b0906,inset 0 0 26px #000a;padding:1em 1.8em;text-align:center}
  #dice .faces{font-size:2.8em;letter-spacing:.2em;color:#fff3d2;text-shadow:var(--sh)}
  #dice .calc{font-size:.78em;color:#b6ab8c;letter-spacing:.08em;line-height:1.8;margin-top:.5em}
  #dice .res{font-size:1.15em;letter-spacing:.3em;margin-top:.55em;text-shadow:var(--sh)}
  #dice .res.win{color:var(--ok)} #dice .res.lose{color:var(--bad)}

  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:1.2em;pointer-events:auto;overflow:auto;
    background:radial-gradient(130% 100% at 50% 40%,#1a1e12,#06070a 76%)}
  .crate{position:relative;width:min(40em,96%);padding:2.2em 2.4em 2em;
    background:
      radial-gradient(circle at 10px 10px,#727c50 1.5px,transparent 2px),
      radial-gradient(circle at calc(100% - 10px) 10px,#727c50 1.5px,transparent 2px),
      radial-gradient(circle at 10px calc(100% - 10px),#727c50 1.5px,transparent 2px),
      radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#727c50 1.5px,transparent 2px),
      linear-gradient(180deg,var(--olive1),var(--olive2));
    border:2px solid var(--edge);border-radius:5px;
    box-shadow:inset 0 0 0 1px #12150c, inset 0 0 60px #000a, 0 6px 0 #00000066}
  .crate::before{content:'';position:absolute;inset:5px;border:1px solid #4b5433;
    border-radius:3px;pointer-events:none}
  .stamp{position:absolute;right:1.4em;top:1.2em;transform:rotate(-7deg);
    border:2px solid #9c4b3a;color:#cf6349;font-size:.78em;letter-spacing:.18em;
    padding:.2em .5em;border-radius:2px}
  .crate h1{margin:0;font-family:var(--stencil);font-weight:400;line-height:.92;
    font-size:4.4em;letter-spacing:.05em;text-transform:uppercase;
    background:repeating-linear-gradient(180deg,#efd694 0 .34em,transparent .34em .43em);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.5px #7b6f3d;filter:drop-shadow(0 3px 0 #00000066)}
  .sub{margin-top:.5em;font-size:.68em;letter-spacing:.26em;color:#a6b078}
  .rule{height:1px;background:linear-gradient(90deg,transparent,#6c7749,transparent);margin:1.3em 0 1.1em}
  .mitems{display:flex;flex-direction:column;gap:.1em}
  .mi{background:none;border:0;color:#ddcd97;cursor:pointer;text-align:left;
    font-family:var(--mil);font-size:1.55em;letter-spacing:.1em;text-transform:uppercase;
    padding:.24em .4em;display:flex;gap:.6em;align-items:center;border-radius:3px;
    text-shadow:0 2px 0 #00000066;transition:color .18s,letter-spacing .18s,background .18s}
  .mi:hover,.mi:focus{color:#fff4c2;background:#ffffff12;letter-spacing:.16em;outline:none}
  .mi b{color:#8b9a55;font-weight:400;transition:transform .18s}
  .mi:hover b{transform:translateX(3px);color:#c6d488}
  .mtext .head{color:#a9b477;letter-spacing:.2em;font-family:var(--mil);font-size:1em;
    margin:.2em 0 .6em;text-transform:uppercase}
  .mtext{display:none;margin-top:1.1em;font-size:.95em;line-height:1.75;color:#bdb49a;min-height:0;
    border-top:1px solid #47502f;padding-top:.7em;font-family:var(--text);
    max-height:42vh;overflow:auto}
  .team{margin-top:1.3em;display:flex;align-items:center;gap:.7em;justify-content:flex-end}
  .team span{font-family:var(--mil);font-size:1.2em;letter-spacing:.16em;
    color:#b6bd7e;text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 12px #97a35a33;
    transform:skewX(-4deg)}
  .team i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#5d6740);font-style:normal}
  .team b{font-family:var(--ui);font-size:.78em;letter-spacing:.28em;color:#79855a;font-weight:400}
  .mtext b{color:#efdcab;font-weight:500}
  .mtext p{margin:0 0 .8em}
  .mtext p:last-child{margin-bottom:0}
  .leg{display:flex;gap:.8em;margin:.3em 0;align-items:baseline}
  .leg u{color:var(--gold);text-decoration:none;min-width:6.6em;flex:none;
    font-family:var(--ui);font-size:.9em;letter-spacing:.12em}
  .keys{display:flex;flex-wrap:wrap;gap:.35em .9em;margin:.1em 0 .7em}
  .keys kbd{font-family:var(--ui);font-size:.82em;background:#0f120a;border:1px solid #5d6740;
    border-radius:3px;padding:.08em .45em;color:#e2d29a}
  #end .crate h1{font-size:2.6em}
  .endtext{display:block;font-family:var(--text);font-size:.98em;line-height:1.75}
  .et-lead{color:#f0e6c8}
  .et-stat{margin-top:.9em;font-family:var(--ui);font-size:.78em;letter-spacing:.08em;color:#95907a;
    border-top:1px solid #47502f;padding-top:.6em}
  .et-verdict{margin-top:.7em;color:#cdd39a}

  #touch{position:absolute;inset:auto 0 2.6em 0;display:none;justify-content:space-between;padding:0 .5em;pointer-events:auto}
  #touch button{width:2.7em;height:2.7em;border:1px solid var(--edge);background:#0f120acc;color:var(--ink);
    font:inherit;border-radius:8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="layer"><div id="ticker"><span id="tick-txt"></span></div></div>

  <div class="layer"><div id="wlabel"></div><div id="carlabel"></div></div>
  <div class="layer"><div id="sms"></div></div>
  <div class="layer"><div id="toast"></div></div>
  <div class="layer"><div id="tip"></div></div>
  <div class="layer"><div id="hint"></div></div>
  <div class="layer"><div id="keys">
    <span><kbd>E</kbd>действие</span><span><kbd>F</kbd>выйти из машины</span>

    <span><kbd>ESC</kbd>закрыть</span>
  </div></div>
  <div class="layer">
    <div id="hud">
      <div class="hrow">
        <span class="km" id="km">12.0 КМ</span>
        <span class="clock" id="clock">ДЕНЬ 1 · 16:00</span>
        <span class="left" id="left">6:00</span>
      </div>
      <div class="gauges" id="gauges"></div>
      <div id="stuff">СИГАРЕТ 14 · 40 000 ₽</div>
    </div>
  </div>

  <div id="panel"></div>
  <div id="dlg"></div>

  <div id="dice"><div class="box">
    <div class="faces" id="dice-f">⚄ ⚂</div>
    <div class="calc" id="dice-c"></div>
    <div class="res" id="dice-r"></div>
  </div></div>

  <div class="screen" id="title">
    <div class="crate">
      <div class="stamp">24 · 09 · 2022</div>
      <h1>Hasta<br>la vista</h1>
      <div class="rule"></div>
      <div class="mitems">
        <button class="mi" id="start"><b>›</b>Новая игра</button>
        <button class="mi" id="m-ctrl"><b>›</b>Управление</button>
        <button class="mi" id="m-about"><b>›</b>О чём это</button>
      </div>
      <div class="mtext" id="mtext"></div>

      <h1 id="end-h">…</h1>
      <div class="rule"></div>

        <div id="end-t" class="et-lead"></div>
        <div id="end-s" class="et-stat"></div>
        <div id="end-v" class="et-verdict"></div>
      </div>
      <div class="mitems" style="margin-top:.9em"><button class="mi" id="again"><b>›</b>Ещё раз</button></div>
    </div>
  </div>

  <div id="touch">
    <button data-k="ArrowLeft">←</button><button data-k="KeyE">E</button>
    <button data-k="Space">⏎</button><button data-k="KeyC">🚬</button>
    <button data-k="KeyF">F</button><button data-k="ArrowRight">→</button>
  </div>
</div>

<script>
(() => {
"use strict";
/* ==========================================================
   Два слоя: подвижный фон рисуется вектором в высоком
   разрешении и масштабируется со сглаживанием; передний план
   рисуется в буфер 320x180 и растягивается ступеньками.
   ========================================================== */
const W=320,H=180,BS=3;                       /* BS — множитель фонового холста */
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const ctx=buf.getContext('2d');
const bgc=document.createElement('canvas');bgc.width=W*BS;bgc.height=H*BS;
const bctx=bgc.getContext('2d');bctx.setTransform(BS,0,0,BS,0,0);
bctx.imageSmoothingEnabled=true;
const cv=document.getElementById('cv'),dctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let kDev=3,kCss=3;
function resize(){
  kCss=Math.min(innerWidth/W,innerHeight/H);
  const cssW=Math.floor(W*kCss),cssH=Math.floor(H*kCss);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  kDev=Math.max(1,Math.round(cssW*dpr/W));
  cv.width=W*kDev;cv.height=H*kDev;
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  stage.style.width=cssW+'px';stage.style.height=cssH+'px';
  stage.style.fontSize=Math.max(11,Math.min(23,Math.round(kCss*4.7)))+'px';
}
addEventListener('resize',resize);resize();
if('ontouchstart' in window)document.getElementById('touch').style.display='flex';

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(c1,c2,t)=>{const a=hex(c1),b=hex(c2);return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')';};
const shade=(c,t)=>mix(c,t<0?'#000000':'#ffffff',Math.abs(t));
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
/* пиксельная растеризация переднего плана */
function pxPoly(pts){
  let minX=1e9,maxX=-1e9;
  for(const p of pts){if(p[0]<minX)minX=p[0];if(p[0]>maxX)maxX=p[0];}
  minX=Math.round(minX);maxX=Math.round(maxX);
  for(let x=minX;x<=maxX;x++){
    const xc=x+0.5,ys=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      if((a[0]<=xc&&b[0]>xc)||(b[0]<=xc&&a[0]>xc))
        ys.push(a[1]+(xc-a[0])/(b[0]-a[0])*(b[1]-a[1]));
    }
    if(ys.length<2)continue;
    ys.sort((p,q)=>p-q);
    for(let i=0;i+1<ys.length;i+=2){
      const y0=Math.round(ys[i]),y1=Math.round(ys[i+1]);
      if(y1>y0)ctx.fillRect(x,y0,1,y1-y0);
    }
  }
}
function pxCircle(cx,cy,r){
  cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);
  for(let dy=-r;dy<=r;dy++){
    const dx=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));
    ctx.fillRect(cx-dx,cy+dy,dx*2+1,1);
  }
}
function pxEllipse(cx,cy,rx,ry){
  cx=Math.round(cx);cy=Math.round(cy);
  for(let dy=-ry;dy<=ry;dy++){
    const dx=Math.floor(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));
    ctx.fillRect(cx-dx,Math.round(cy+dy),dx*2+1,1);
  }
}

const NEWS=[
 '24.09 · ФТС: на подъезде к «Верхнему Ларсу» более 2300 автомобилей',

const hourNow=()=>(16+S.t/60)%24,dayNow=()=>1+Math.floor((16+S.t/60)/24);
const isNight=()=>{const h=hourNow();return h<6.2||h>19.4;};
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}   /* мягкая S-кривая */
function nightAmt(){const h=hourNow();
  if(h>=20.5||h<4.5)return 1;
  if(h>=17)return smooth((h-17)/3.5);      /* сумерки тянутся три с половиной часа */
  if(h<7.5)return 1-smooth((h-4.5)/3);     /* и рассвет — три */
  return 0;}

function smoke(inside){
  if(S.cigs<=0){toast('СИГАРЕТ НЕТ');stress(4);return;}
  S.cigs--;S.nic=clamp(S.nic+40,0,100);S.t+=7;stress(-9);
  closePanel();
  if(!inside||S.alone){toast('ЗАКУРИЛ');return;}
  if(S.t-S.lastSmokeIn>200)S.smokeIn=0;         /* через три часа забывается */
  S.lastSmokeIn=S.t;S.smokeIn++;
  if(S.promised){                                /* ты обещал не курить в салоне */
    fam(-13,17);S.smokeIn=3;
    say('МАРЬЯ',['— Ты обещал.','Она не поворачивается. Стекло опускает Тео, сам.']);
    return;
  }
  if(S.smokeIn===1){fam(-3,4);toast('ЗАКУРИЛ В МАШИНЕ');}
  else if(S.smokeIn===2){fam(-6,8);
    say('',['Марья опускает своё стекло до упора и держит руку на кнопке.',
            'Тео кашляет — может, взаправду, может, за компанию.']);}
  else scandal();
}

/* ============ драка на кубиках ============ */
function fight(reason,cfg){
  cfg=cfg||{};const mods=[];let mod=0;
  if(S.flags.artemFriend){mod+=1;mods.push('Артём рядом +1');}
  if(S.stress>=60&&S.stress<=80){mod+=1;mods.push('злость +1');}
  if(S.stress>80){mod-=1;mods.push('руки трясутся −1');}
  if(craving()>0.6){mod-=1;mods.push('ломка −1');}
  if(S.fights>0){mod-=1;mods.push('тебя уже запомнили −1');}
  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);
  const sum=d1+d2+mod;
  S.dice={d1,d2,mod,mods,sum,win:sum>=9,cfg,reason,t:0,phase:'roll'};
  diceEl.style.display='flex';
  document.getElementById('dice-r').textContent='';
  document.getElementById('dice-c').textContent='';
}
const FACE=['','⚀','⚁','⚂','⚃','⚄','⚅'];
function diceStep(dt){
  const D=S.dice;if(!D)return;D.t+=dt;
  const f=document.getElementById('dice-f');
  if(D.phase==='roll'){
    f.textContent=FACE[1+Math.floor(Math.random()*6)]+' '+FACE[1+Math.floor(Math.random()*6)];
    if(D.t>0.9){
      D.phase='done';f.textContent=FACE[D.d1]+' '+FACE[D.d2];
      document.getElementById('dice-c').innerHTML=
        D.reason.toUpperCase()+'<br>бросок '+D.d1+'+'+D.d2+(D.mod?(D.mod>0?' +':' ')+D.mod:'')+

function applyFight(D){

  if(D.win){S.km-=(c.winKm!==undefined?c.winKm:160);if(c.winFuel)S.fuel+=c.winFuel;
    stress(-12);fam(-10,c.winAnx!==undefined?c.winAnx:22);}
  else{S.km+=(c.loseKm!==undefined?c.loseKm:260);stress(22);
    fam(-14,c.loseAnx!==undefined?c.loseAnx:38);}

/* ============ змейка ============ */
function startSnake(){S.overlay='snake';
  S.snake={g:[{x:6,y:4}],dir:{x:1,y:0},nd:{x:1,y:0},food:{x:10,y:3},acc:0,score:0,dead:false,cols:14,rows:8};}
function snakeStep(dt){
  const s=S.snake;if(!s)return;
  S.batt=clamp(S.batt-dt*0.55,0,100);
  if(s.dead){s.acc+=dt;if(s.acc>1.4)stopSnake();return;}
  s.acc+=dt;if(s.acc<0.16)return;s.acc=0;
  s.dir=s.nd;
  const h={x:s.g[0].x+s.dir.x,y:s.g[0].y+s.dir.y};
  if(h.x<0||h.y<0||h.x>=s.cols||h.y>=s.rows||s.g.some(p=>p.x===h.x&&p.y===h.y)){s.dead=true;stress(5);return;}
  s.g.unshift(h);
  if(h.x===s.food.x&&h.y===s.food.y){s.score++;stress(-3);
    s.food={x:Math.floor(Math.random()*s.cols),y:Math.floor(Math.random()*s.rows)};}
  else s.g.pop();
}
function stopSnake(){const sc=S.snake?S.snake.score:0;S.snake=null;S.overlay=null;toast('ЗМЕЙКА: '+sc);}

/* ============ очередь и тик ============ */
function advance(){
  if(S.stalled){S.stalled=0;toast('РЯД УШЁЛ БЕЗ ТЕБЯ');S.nextAdv=S.t+rnd(20,40);return;}
  if(S.mode==='foot'&&Math.abs(S.px-CAR_MID)>210){
    S.km+=70;stress(8);fam(-3,7);S.misses++;toast('ТЫ БЫЛ СЛИШКОМ ДАЛЕКО ОТ МАШИНЫ');
  }else{const d=rnd(120,520);S.km-=d;S.fuel-=0.3;S.bgOff+=d*0.05;S.advAnim=1;stress(-3);fam(2,-4);
    if(S.mode==='foot')toast('УСПЕЛ · РЯД ПРОШЁЛ '+Math.round(d)+' М');}
  S.nextAdv=S.t+rnd(22,58);S.honk=false;
}
function step(dt){
  if(S.scene!=='play')return;
  const busy=S.dialog||S.panel||S.dice||S.overlay;
  /* таймер эпизода: во время чтения идёт втрое медленнее */
  S.left-=busy?0:dt;                    /* пока открыт диалог, время не идёт */
  if(S.left<=0&&!busy){S.left=0;finish('open');return;}
  if(S.dice){diceStep(dt);return;}
  if(S.overlay==='snake'){snakeStep(dt);S.t+=dt*6;return;}
  const rate=(S.ff&&!busy)?26:5;
  if(!busy||S.ff)S.t+=dt*rate;
  const dm=dt*rate,night=isNight(),cr=craving();
  S.fuel-=dm*(night?0.012:0.007);
  S.water-=dm*0.0026;
  S.batt-=dm*(0.010+(S.radio?0.004:0));
  S.nic-=dm*0.055;                     /* сигареты хватает примерно на треть эпизода */
  S.bladder+=dm*0.038;
  stress(dm*(0.008+cr*0.02+(S.bladder>75?0.03:0)+(S.water<=0?0.06:0)+(S.fam.anx>70?0.025:0)+(night?0.005:0)));
  if(!S.alone){
    S.fam.anx=clamp(S.fam.anx+dm*(0.010+(100-S.fam.happy)/8000+(night?0.005:0)+(S.fuel<4?0.02:0)),0,100);
    S.fam.happy=clamp(S.fam.happy-dm*0.004,0,100);
  }
  S.fuel=Math.max(0,S.fuel);S.water=Math.max(0,S.water);
  S.batt=clamp(S.batt,0,100);S.nic=clamp(S.nic,0,100);S.bladder=clamp(S.bladder,0,100);
  S.bikePrice=Math.min(100000,38000+S.t*38);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*1.5);
  if(!S.alone&&!S.warned&&S.fam.anx>76){S.warned=true;
    sms('МАРЬЯ · ИЗ МАШИНЫ','если так будет ещё час, мы пойдём пешком. я серьёзно');
    toast('СЕМЬЯ НА ПРЕДЕЛЕ — УСПОКОЙТЕ ИХ');}
  if(S.warned&&S.fam.anx<62)S.warned=false;
  if(!S.honk&&S.t>S.nextAdv-26){S.honk=true;if(S.mode==='foot')toast('СИГНАЛЯТ СЗАДИ');}
  if(S.t>=S.nextAdv){advance();S.ff=false;}
  if(S.advAnim>0)S.advAnim=Math.max(0,S.advAnim-dt*1.6);
  if(S.t>S.nextSms){S.nextSms=S.t+rnd(260,460);
    if(S.batt>3&&!S.honk){const m=pick(SMSES);sms(m.w,m.t);stress(2);}}
  if(S.t>S.nextToxic&&S.t>S.quietUntil&&!S.honk&&S.mode==='car'&&!busy&&!S.alone){S.nextToxic=S.t+rnd(240,420);toxic();}
  if(S.mode==='foot'){
    if(keys['ArrowLeft']){S.px-=66*dt;S.face=-1;S.walk+=dt*9;}
    if(keys['ArrowRight']){S.px+=66*dt;S.face=1;S.walk+=dt*9;}
    S.px=clamp(S.px,CAR_X-6*SPACING-40,CAR_X+9*SPACING+70);
  }
  for(const w of WANDER){w.x+=w.d*w.v*dt;w.ph+=dt*7;
    if(w.x<CAR_X-6*SPACING||w.x>CAR_X+9*SPACING){w.d*=-1;w.line=pick(PASSER);}}
  for(const c of CARS){if(Math.random()<0.0015)c.puff=1;if(c.puff>0)c.puff-=dt*0.7;}
  for(const cl of CLOUDS){cl.x-=cl.v*dt*2;if(cl.x<-cl.w){cl.x=W+cl.w;cl.y=rnd(16,54);}}
  if(!busy){
    const softOk=S.t-S.lastSoft>150;      /* не чаще раза в два с половиной часа */
    if(S.fuel<=0&&!S.stalled&&softOk)softFuel();
    else if(S.stress>=100&&softOk)softStress();
    else if(!S.alone&&(S.fam.anx>=100||S.fam.happy<=0))softFamily();
    else checkEvents();
  }
  if(S.km<=0&&!busy)finish('border');
}

/* ============ ФОН (вектор, сглаженный) ============ */
const SKY=[{h:0,a:'#060a16',b:'#111d33'},{h:5,a:'#1b2547',b:'#775a6a'},
 {h:7,a:'#5c86b8',b:'#e2bd97'},{h:11,a:'#84bce4',b:'#dcecf4'},
 {h:17,a:'#7fadd8',b:'#f0dcc0'},{h:19,a:'#3c355f',b:'#e08d5f'},
 {h:21,a:'#0e1729',b:'#212c47'},{h:24,a:'#060a16',b:'#111d33'}];
function sky(h){for(let i=0;i<SKY.length-1;i++)if(h>=SKY[i].h&&h<=SKY[i+1].h){
  const t=(h-SKY[i].h)/(SKY[i+1].h-SKY[i].h);
  return [mix(SKY[i].a,SKY[i+1].a,t),mix(SKY[i].b,SKY[i+1].b,t)];}
  return [SKY[0].a,SKY[0].b];}
function ridge(x,seed,amp){return Math.sin(x*0.0085+seed)*amp+Math.sin(x*0.025+seed*2.3)*amp*0.45
  +Math.sin(x*0.058+seed*4.1)*amp*0.18;}
function vRidge(off,base,amp,col,seed){
  bctx.fillStyle=col;bctx.beginPath();bctx.moveTo(-6,H);
  let px=-6,py=base-Math.abs(ridge(off-6,seed,amp))-6;bctx.lineTo(px,py);
  for(let x=4;x<=W+6;x+=4){
    const y=base-Math.abs(ridge(x+off,seed,amp))-6;
    bctx.quadraticCurveTo(px,py,(px+x)/2,(py+y)/2);px=x;py=y;}
  bctx.lineTo(W+6,py);bctx.lineTo(W+6,H);bctx.closePath();bctx.fill();
}
function vTrees(off,base,col,seed){
  /* мягкая кромка леса: округлые кроны, пониженный контраст, лёгкое размытие */
  bctx.save();
  if('filter' in bctx)bctx.filter='blur(0.7px)';
  bctx.globalAlpha=0.8;bctx.fillStyle=col;
  for(let x=-10;x<W+10;x+=4){
    const k=hash(Math.round(x+off));
    if(k<0.3)continue;
    const y=base-Math.abs(ridge(x+off,seed,10))-5,hh=2.5+k*4.5,w=1.4+k*1.2;
    bctx.beginPath();
    bctx.moveTo(x-w,y+1);
    bctx.quadraticCurveTo(x-w*0.6,y-hh*0.55,x,y-hh);
    bctx.quadraticCurveTo(x+w*0.6,y-hh*0.55,x+w,y+1);
    bctx.closePath();bctx.fill();
  }
  bctx.restore();
}

  for(const wx of M.wheels)pxCircle(fx(wx),y-M.wr+1,M.wr*0.42);

function drawPerson(x,y,col,phase,face,k){
  x=Math.round(x);y=Math.round(y);

  ctx.fillStyle='#c1996f';ctx.fillRect(x+Math.round(s),y-h,Math.round(4*s),Math.round(4*s));
  ctx.fillStyle=col;ctx.fillRect(x,y-h+Math.round(4*s),w,Math.round(7*s));
  ctx.fillStyle=shade(col,-0.25);ctx.fillRect(x,y-h+Math.round(4*s),1,Math.round(7*s));
  ctx.fillStyle='#242938';
  const ly=y-Math.round(5*s),lh=Math.round(5*s),lw=Math.max(1,Math.round(2*s));
  if(st){ctx.fillRect(x,ly,lw,lh);ctx.fillRect(x+w-lw,ly,lw,lh);}

/* сборка кадра: гладкий фон + пиксельный фронт + грейд */
function compose(t){
  const cw=W*kDev,ch=H*kDev;
  dctx.imageSmoothingEnabled=true;
  dctx.drawImage(bgc,0,0,bgc.width,bgc.height,0,0,cw,ch);
  dctx.imageSmoothingEnabled=false;
  dctx.drawImage(buf,0,0,W,H,0,0,cw,ch);
  const cr=craving();
  if(cr>0.02){
    dctx.globalCompositeOperation='saturation';dctx.globalAlpha=cr*0.85;
    dctx.fillStyle='hsl(0,0%,50%)';dctx.fillRect(0,0,cw,ch);
    dctx.globalCompositeOperation='multiply';dctx.globalAlpha=cr*0.4;
    dctx.fillStyle='#d3bf8b';dctx.fillRect(0,0,cw,ch);
    dctx.globalCompositeOperation='source-over';dctx.globalAlpha=1;
    const p=0.6+0.4*Math.sin(t*2.4);
    const vg=dctx.createRadialGradient(cw/2,ch/2,cw*0.08,cw/2,ch/2,cw*0.68);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(26,17,9,'+(0.55*cr*p)+')');
    dctx.fillStyle=vg;dctx.fillRect(0,0,cw,ch);
  }
  if(S.stress>68){
    const k=(S.stress-68)/32,p=0.5+0.5*Math.sin(t*3.6);
    const vg=dctx.createRadialGradient(cw/2,ch/2,cw*0.11,cw/2,ch/2,cw*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(120,30,20,'+(0.3*k*p)+')');

  }
  if(S.honk&&S.mode==='foot'){dctx.fillStyle='rgba(255,170,110,0.10)';dctx.fillRect(0,0,cw,ch);}
}

  for(const g of GAUGES){
    const e=gaugeEls[g.id],v=g.val(),r=clamp(v/g.max,0,1),n=Math.round(r*10);
    if(n!==e.n){for(let i=0;i<10;i++)e.segs[i].className=i<n?'on':'';e.n=n;}
    const txt=String(g.fmt(v));
    if(txt!==e.txt){e.vl.textContent=txt;e.txt=txt;}
    let cls='g';
    if(g.inv)cls+=r>0.8?' bad':r>0.55?' warn':'';
    else cls+=r<0.2?' bad':r<0.4?' warn':' good';
    if(cls!==e.cls){e.root.className=cls;e.cls=cls;}
  }
  const st='СИГАРЕТ '+S.cigs+' · '+Math.round(S.money).toLocaleString('ru-RU')+' ₽'+
           (S.bike?' · ВЕЛОСИПЕД':'')+(S.alone?' · ОДИН':'')+(S.promised?' · НЕ КУРИТЬ В САЛОНЕ':'')+(S.bladder>65?' · НУЖНО ОТЛИТЬ':'');
  const se=document.getElementById('stuff');
  if(se.textContent!==st)se.textContent=st;
}
let hudT=0;
function hud(){
  const km=(Math.max(0,S.km)/1000).toFixed(1)+' КМ',kel=document.getElementById('km');
  if(kel.textContent!==km)kel.textContent=km;
  const hh=Math.floor(hourNow()),mm=Math.floor((hourNow()%1)*60);
  const cl='ДЕНЬ '+dayNow()+' · '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const cel=document.getElementById('clock');if(cel.textContent!==cl)cel.textContent=cl;
  const lm=Math.floor(S.left/60),ls=Math.floor(S.left%60);
  const lt=lm+':'+String(ls).padStart(2,'0'),lel=document.getElementById('left');
  if(lel.textContent!==lt)lel.textContent=lt;
  lel.classList.toggle('hot',S.left<60);
  updateGauges();
  const busy=S.dialog||S.panel||S.dice||S.overlay||S.scene!=='play';
  const sp=(!busy&&S.mode==='foot')?near():null;
  /* где моя машина: метка над ней или стрелка у края экрана */
  const carEl=document.getElementById('carlabel');
  if(!busy&&S.mode==='foot'){
    const sx=CAR_MID-camX(),d=Math.abs(S.px-CAR_MID),m=Math.round(d*0.09);
    let txt,px;
    if(sx>14&&sx<W-14){txt=(d<SIT_R?'<b>[ E ]</b> &nbsp;сесть в машину':'ваша машина');px=sx;}
    else if(sx<=14){txt='<b>◀</b> ваша машина · '+m+' м';px=26;}
    else{txt='ваша машина · '+m+' м <b>▶</b>';px=W-26;}
    carEl.style.display='block';carEl.innerHTML=txt;
    carEl.style.left=Math.round(px*kCss)+'px';
    carEl.style.top=Math.round((GROUND-46)*kCss)+'px';
  } else carEl.style.display='none';
  if(sp){
    const wx=(sp.ref?sp.ref.x:sp.x)-camX();
    wlabel.style.display='block';
    wlabel.innerHTML='<b>[ E ]</b> &nbsp;'+sp.label;
    wlabel.style.left=Math.round(wx*kCss)+'px';
    wlabel.style.top=Math.round((GROUND-30)*kCss)+'px';
  } else wlabel.style.display='none';
  const hint=document.getElementById('hint');let ht='';
  if(!busy){
    if(S.mode==='car')ht='Вы в машине · E — меню · C — закурить · F — выйти';
    else ht=sp?'':(Math.abs(S.px-CAR_MID)<SIT_R?'E — сесть в машину'
                   :'Вы снаружи · ← → идти · E — подойти и поговорить');
  }
  if(hint.textContent!==ht)hint.textContent=ht;
  const kk=document.getElementById('keys'),kw=busy?'none':'flex';
  if(kk.style.display!==kw)kk.style.display=kw;
  const tp=document.getElementById('tip'),tt=busy?'':currentTip();
  if(tp.textContent!==tt)tp.textContent=tt;
  const urg=!busy&&S.honk&&S.mode==='foot';
  if(tp.classList.contains('urgent')!==urg)tp.classList.toggle('urgent',urg);
  const tk=document.getElementById('ticker'),want=S.radio?'block':'none';
  if(tk.style.display!==want)tk.style.display=want;
}
/* самая срочная подсказка: игра сама говорит, что можно сделать */
function currentTip(){
  const rock=SPOTS.find(x=>x.key==='rock');
  const dR=Math.round(Math.abs(S.px-rock.x)*0.09);
  if(S.honk&&S.mode==='foot'){
    const d=Math.round(Math.abs(S.px-CAR_MID)*0.09);
    return d>4?'РЯД СЕЙЧАС ТРОНЕТСЯ · до машины '+d+' м'
              :'РЯД СЕЙЧАС ТРОНЕТСЯ · вы у машины, E — сесть';}
  if(S.bike)return 'Велосипед куплен · E — меню машины, «бросить машину и ехать дальше»';
  if(S.bladder>65)
    return S.mode==='car'?'Нужно отлить · F — выйти, потом идти налево к камню'
                         :'Нужно отлить · камень слева, '+dR+' м';
  if(!S.alone&&S.fam.anx>70)
    return S.mode==='car'?'Марья на пределе · E — меню машины, «Успокоить семью»'
                         :'Марья на пределе · вернитесь в машину и поговорите';
  if(!S.alone&&S.fam.happy<30)
    return S.mode==='car'?'Семье тяжело · мультик Тео или вода помогают'
                         :'Семье тяжело · ларёк с едой справа по ряду';
  if(craving()>0.7)return 'Тяга · C — закурить, снаружи это бесплатно';
  if(S.stress>75)return 'Стресс высокий · костёр слева, сигарета или разговор снимают';
  if(S.water<1.2)return 'Вода кончается · ларёк справа по ряду';
  if(S.fuel<6)return 'Бензин кончается · мужик с канистрой справа';
  if(S.batt<20)return 'Телефон садится · выключите радио в меню машины';
  return '';
}
function near(){
  if(Math.abs(S.px-CAR_MID)<SIT_R)return null;
  for(const sp of SPOTS)if(Math.abs(S.px-sp.x)<28)return sp;
  for(const w of WANDER)if(Math.abs(S.px-w.x)<22)return {kind:'passer',label:'Прохожий',ref:w};
  return null;
}
const tickTxt=document.getElementById('tick-txt');
tickTxt.textContent=NEWS.join('   ·   ')+'   ·   ';
let tickX=600;
function tickerStep(dt){
  if(!S.radio)return;
  tickX-=dt*30;
  const w=tickTxt.offsetWidth||900;
  if(tickX<-w)tickX=stage.clientWidth;
  tickTxt.style.transform='translateX('+Math.round(tickX)+'px)';
}

/* ============ ввод ============ */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;press(e.code);});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;press(k);});
  b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false;});
  b.addEventListener('pointerleave',()=>keys[k]=false);});
function press(code){
  if(S.scene!=='play'&&S.scene!=='reflect')return;
  if(S.dice){if(S.dice.phase==='done')endDice();return;}
  if(S.overlay==='snake'){
    const s=S.snake;if(!s)return;
    if(code==='ArrowLeft'&&s.dir.x===0)s.nd={x:-1,y:0};
    if(code==='ArrowRight'&&s.dir.x===0)s.nd={x:1,y:0};
    if(code==='ArrowUp'&&s.dir.y===0)s.nd={x:0,y:-1};
    if(code==='ArrowDown'&&s.dir.y===0)s.nd={x:0,y:1};
    if(code==='Escape'||code==='KeyE')stopSnake();
    return;}
  if(S.ff&&code!=='Space')S.ff=false;
  if(S.dialog){
    if(code==='Escape'){
      if(S.dialog.opts)toast('НУЖНО ВЫБРАТЬ ОТВЕТ — 1, 2 ИЛИ 3');
      else closeDlg();
      return;}
    if(code==='Space')nextLine();
    if(S.dialog&&S.dialog.opts&&/^Digit[1-9]$/.test(code))choose(+code.slice(5)-1);
    return;}
  if(S.scene!=='play')return;
  if(code==='KeyC'){
    if(S.mode==='car')smokeMenu();          /* в машине всегда спрашиваем, где курить */
    else smoke(false);
    return;}
  if(S.panel){
    if(/^Digit[1-9]$/.test(code)){const k=+code.slice(5)-1;
      if(S.panel[k]&&optAllowed(S.panel[k]))S.panel[k].f();}
    if(code==='KeyF'||code==='Escape')closePanel();
    return;}
  if(code==='KeyE'){
    if(S.mode==='car'){carMenu();return;}
    const sp=near();
    if(sp&&sp.kind==='passer')talkPasser(sp.ref);
    else if(sp)TALK[sp.key]();
    else if(Math.abs(S.px-CAR_MID)<SIT_R){S.mode='car';toast('ВЫ СЕЛИ В МАШИНУ');}}
  if(code==='KeyF'&&S.mode==='car'){S.mode='foot';S.px=CAR_X+64;}
  if(code==='Space'&&S.mode==='car')S.ff=!S.ff;
}

document.getElementById('start').onclick=()=>{
  document.getElementById('title').style.display='none';S.scene='play';
  const op=pick(OPENERS);say(op[0],op[1]);

document.getElementById('again').onclick=()=>{
  reset();document.getElementById('end').style.display='none';
  closeDlg();closePanel();smsEl.innerHTML='';S.scene='play';};

/* ============ цикл ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  step(dt);renderBG(now/1000);renderFG(now/1000);compose(now/1000);tickerStep(dt);
  hudT-=dt;if(hudT<=0){hud();hudT=0.12;}
  if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.opacity=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
